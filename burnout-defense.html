<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Head of AI: defence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03050b;--panel:#0e1524;--line:#1d2941;--line2:#2b3d5e;
  --text:#e9effb;--dim:#7d92b5;
  --cyan:#35e6d5;--violet:#a379ff;--amber:#ffc24b;--mint:#6ee7a0;--coral:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);
  font-family:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:540px;margin:0 auto;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(130% 55% at 12% -8%, rgba(163,121,255,.22), transparent 62%),
    radial-gradient(115% 45% at 92% 2%, rgba(53,230,213,.15), transparent 58%),
    linear-gradient(180deg,#0a1020 0%, var(--void) 72%)}

#hud{flex:0 0 auto;display:flex;align-items:stretch;gap:5px;padding:8px 10px 5px}
.stat{position:relative;display:flex;flex-direction:column;gap:1px;padding:6px 9px 6px 10px;border-radius:12px;
  background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.012));border:1px solid var(--line)}
.stat::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:currentColor}
.stat b{font-size:14.5px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--text)}
.stat span{font-size:9px;color:var(--dim);font-weight:500}
#sanityStat{color:var(--coral)}#focusStat{color:var(--cyan)}#waveStat{color:var(--violet)}
#hud .grow{flex:1}
.iconbtn{width:31px;flex:0 0 auto;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);
  border:1px solid var(--line);color:var(--dim);font-size:12px;font-family:inherit;display:grid;place-items:center}
.iconbtn.on{color:var(--cyan);border-color:#20514f;background:rgba(53,230,213,.09)}
#sanityTrack{height:3px;margin:0 10px 4px;background:#121a2c;border-radius:3px;overflow:hidden}
#sanityFill{height:100%;width:100%;background:linear-gradient(90deg,#ff3b4e,#ff9aa0);transition:width .3s}

#stage{flex:1 1 auto;position:relative;display:grid;place-items:center;min-height:0;padding:0 5px}
canvas#cv{display:block;border-radius:16px;touch-action:none}

#callRow{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:7px;pointer-events:none}
#callRow button{pointer-events:auto;cursor:pointer;font-family:inherit;border-radius:999px;font-size:12.5px;font-weight:600;
  padding:9px 16px;display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#callBtn{border:1px solid #237068;color:#c9fff8;background:linear-gradient(180deg,rgba(30,116,107,.96),rgba(11,48,45,.96))}
#callBtn small{color:#5fd8c8;font-weight:500;font-size:10.5px}
#briefBtn{border:1px solid var(--line2);color:var(--dim);background:rgba(14,21,36,.92)}
#callRow.hidden{display:none}

#inspect{position:absolute;left:9px;right:9px;bottom:9px;display:none;padding:11px 12px;border-radius:16px;
  background:linear-gradient(180deg,rgba(19,28,46,.98),rgba(9,14,25,.98));border:1px solid var(--line2);
  backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
#inspect.show{display:block}
#inspect .r1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#insDot{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center}
#insName{font-size:13.5px;font-weight:600;flex:1}
#insLvl{font-size:10.5px;color:var(--dim)}
#insBlurb{font-size:11px;color:#9db0cd;line-height:1.5;margin-bottom:5px}
#insNums{font-size:10.5px;color:var(--dim);margin-bottom:9px;display:flex;gap:11px;flex-wrap:wrap}
#insNums i{font-style:normal;color:var(--text);font-weight:600}
#inspect .btns{display:flex;gap:6px}
#inspect button{flex:1;font-family:inherit;font-size:12px;font-weight:600;padding:9px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text)}
#upBtn{border-color:#237068;background:linear-gradient(180deg,rgba(30,116,107,.9),rgba(12,52,49,.9));color:#c9fff8}
#upBtn:disabled{opacity:.35;background:rgba(255,255,255,.03);border-color:var(--line);color:var(--dim)}
#sellBtn{flex:0 0 74px;color:#ff9aa4;border-color:#4d2833;background:rgba(80,26,38,.5)}
#closeBtn{flex:0 0 40px;color:var(--dim)}

.pb{display:flex;gap:9px;padding:8px 0;border-top:1px solid rgba(43,61,94,.5);align-items:flex-start}
.pb:first-of-type{border-top:0}
.pb img{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.03);flex:0 0 auto}
.pb .pn{font-size:11.5px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;flex-wrap:wrap}
.pb .pa{font-size:11px;color:#9db0cd;line-height:1.45}
.pb.locked{opacity:.42}
.pb.locked img{filter:grayscale(1)}
.pb.locked .pa{color:var(--dim)}
.lock{font-size:8.5px;padding:2px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);
  margin-left:6px;font-weight:500}
.progrow{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:4px}
.progrow b{color:var(--cyan);font-weight:600}
.prog{height:6px;border-radius:6px;background:#121a2c;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet))}

#preview{position:absolute;left:9px;right:9px;bottom:9px;display:none;padding:11px 12px;border-radius:16px;
  background:linear-gradient(180deg,rgba(19,28,46,.97),rgba(9,14,25,.97));border:1px solid var(--line2);
  backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
#preview.show{display:block}
#preview .r1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#pvDot{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center}
#pvName{font-size:13.5px;font-weight:600;flex:1}
#pvCost{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
#pvCost.poor{color:#ff8a95}
#pvX{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);color:var(--dim);font-family:inherit;font-size:11px;cursor:pointer}
#pvBlurb{font-size:11.5px;color:#9db0cd;line-height:1.5;margin-bottom:7px}
#pvNums{font-size:10.5px;color:var(--dim);display:flex;gap:11px;flex-wrap:wrap;margin-bottom:8px}
#pvNums i{font-style:normal;color:var(--text);font-weight:600}
#preview .tg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
#preview .tg em{font-style:normal;font-size:9px;padding:2px 7px;border-radius:20px;
  border:1px solid currentColor;opacity:.85}
.pvline{display:flex;gap:7px;font-size:11px;line-height:1.45;margin-bottom:5px}
.pvline u{text-decoration:none;flex:0 0 auto;font-weight:700;font-size:10px;padding-top:1px}
.pvline.good u{color:var(--mint)}.pvline.good div{color:#9fd6b6}
.pvline.weak u{color:var(--coral)}.pvline.weak div{color:#d5a3ab}
#pvHint{font-size:10px;color:var(--dim);margin-top:8px;padding-top:7px;border-top:1px solid rgba(43,61,94,.6)}

#shop{flex:0 0 auto;display:flex;gap:6px;padding:7px 9px 11px;overflow-x:auto;scrollbar-width:none}
#shop::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 84px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);
  padding:7px;border-radius:14px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
.card::after{content:'';position:absolute;inset:-40% -60% auto auto;width:86px;height:86px;border-radius:50%;
  background:currentColor;opacity:.14;filter:blur(22px)}
.card .g{height:28px;margin-bottom:3px;position:relative}
.card .nm{font-size:10px;font-weight:600;line-height:1.24;height:25px;color:var(--text);position:relative}
.card .ct{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.card.sel{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset,0 0 18px -4px currentColor}
.card.poor{opacity:.38}

/* overlay */
#ov{position:absolute;inset:0;display:none;z-index:9;border-radius:16px;overflow:hidden;
  background:radial-gradient(80% 50% at 50% 30%,rgba(11,18,32,.96),rgba(2,4,9,.99))}
#ov.show{display:block}
#ovScroll{position:absolute;inset:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;justify-content:center}
#ov h1{font-size:30px;line-height:.95;font-weight:700;letter-spacing:-.04em;margin:0 0 6px}
#ov h1 em{font-style:normal;display:block;background:linear-gradient(90deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#ov .kick{font-size:12px;color:var(--dim);line-height:1.6;margin:0 0 14px}
#ov .lore{font-size:12px;line-height:1.65;color:#a9bcd9;margin:0 0 12px;border-left:2px solid var(--line2);padding-left:11px}
#ov .lore b{color:var(--text);font-weight:600}
#ov button{width:100%;font-family:inherit;font-size:13.5px;font-weight:600;padding:12px;border-radius:13px;cursor:pointer;
  border:1px solid #2a7d73;color:#03130f;background:linear-gradient(180deg,#57f2df,#22b6a6);
  box-shadow:0 10px 26px -12px rgba(53,230,213,.8)}
#ov button.ghost{background:transparent;border-color:var(--line2);color:var(--dim);margin-top:7px;box-shadow:none}

.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eyebrow b{font-size:11px;font-weight:600;color:var(--violet)}
.eyebrow i{flex:1;height:1px;background:var(--line2)}
.eyebrow s{text-decoration:none;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

.foe{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(43,61,94,.5)}
.foe:first-of-type{border-top:0}
.foe img{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:rgba(255,255,255,.03)}
.foe .fn{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:2px}
.foe .fd{font-size:11px;color:#9db0cd;line-height:1.45}
.foe .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.foe .tg em{font-style:normal;font-size:9px;padding:2px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--dim)}
.foe .tg em.hot{color:#ffb0b0;border-color:#5a2c34;background:rgba(120,30,45,.28)}

#ovStats{display:flex;gap:8px;margin:0 0 14px}
#ovStats div{flex:1;border:1px solid var(--line);border-radius:11px;padding:8px;background:rgba(255,255,255,.03)}
#ovStats b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
#ovStats span{font-size:9px;color:var(--dim)}
.lesson{display:flex;gap:9px;padding:7px 0;border-top:1px solid rgba(43,61,94,.5);font-size:11.5px;line-height:1.5;color:#a9bcd9}
.lesson b{color:var(--text);font-weight:600}
.lesson u{text-decoration:none;color:var(--cyan);font-weight:700;flex:0 0 auto;font-size:11px;padding-top:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" id="sanityStat"><b id="sanityVal">16</b><span>sanity</span></div>
    <div class="stat" id="focusStat"><b id="focusVal">300</b><span>focus</span></div>
    <div class="stat" id="waveStat"><b id="waveVal">0/25</b><span>wave</span></div>
    <div class="grow"></div>
    <button class="iconbtn on" id="sndBtn">♪</button>
    <button class="iconbtn" id="pauseBtn">❚❚</button>
  </div>
  <div id="sanityTrack"><div id="sanityFill"></div></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="callRow">
      <button id="briefBtn">Brief</button>
      <button id="callBtn"><span>Start wave 1</span><small id="callBonus"></small></button>
    </div>
    <div id="preview">
      <div class="r1"><div id="pvDot"></div><div id="pvName"></div><div id="pvCost"></div><button id="pvX">✕</button></div>
      <div id="pvBlurb"></div>
      <div id="pvNums"></div>
      <div class="tg" id="pvTags"></div>
      <div class="pvline good"><u>Use for</u><div id="pvGood"></div></div>
      <div class="pvline weak"><u>Blind to</u><div id="pvWeak"></div></div>
      <div id="pvHint"></div>
    </div>
    <div id="inspect">
      <div class="r1"><div id="insDot"></div><div id="insName"></div><div id="insLvl"></div></div>
      <div id="insBlurb"></div><div id="insNums"></div>
      <div class="btns"><button id="upBtn">Upgrade</button><button id="sellBtn">Sell</button><button id="closeBtn">✕</button></div>
    </div>
    <div id="ov"><div id="ovScroll"><div id="ovBox"></div></div></div>
  </div>
  <div id="shop"></div>
</div>

<script>
"use strict";
(function(){

/* ===================== grid ===================== */
const COLS=9, ROWS=14;
const WPG=[[-1,1],[7,1],[7,4],[1,4],[1,7],[7,7],[7,10],[1,10],[1,12],[9,12]];
const pathKeys=new Set();
(function(){for(let i=0;i<WPG.length-1;i++){let[ax,ay]=WPG[i];const[bx,by]=WPG[i+1];
  const dx=Math.sign(bx-ax),dy=Math.sign(by-ay);let x=ax,y=ay;
  while(x!==bx||y!==by){if(x>=0&&x<COLS)pathKeys.add(x+','+y);x+=dx;y+=dy}
  if(bx>=0&&bx<COLS)pathKeys.add(bx+','+by)}})();

/* ===================== defences ===================== */
const TOWERS={
  evalsuite:{name:'Eval suite',cost:65,col:'#ffc24b',dmg:8,rate:.24,range:2.2,kind:'bullet',vel:15,
    bonusFam:'hallu',bonus:2.0,
    blurb:'Cheap and relentless. Double damage to anything the model invented, and the only thing an eval gap respects.'},
  guardrail:{name:'Guardrails',cost:100,col:'#6ee7a0',dmg:7,rate:.55,range:2.7,kind:'bullet',vel:11,slow:.5,slowDur:2.2,
    blurb:'Barely damages anything. Slows what it can hit so everything else gets a second shot.'},
  observ:{name:'Observability grid',cost:165,col:'#35e6d5',dmg:26,rate:.95,range:2.8,kind:'bullet',vel:10,splash:1.0,reveal:true,
    blurb:'Splash damage, and the only thing that can see Shadow AI or unregistered agents.'},
  router:{name:'Model router',cost:200,col:'#ff8a4b',dmg:24,rate:1.05,range:3.0,kind:'chain',chain:4,falloff:.74,
    blurb:'Arcs across four targets. Best value against crowds, useless against anything that hides in one.'},
  council:{name:'Governance council',cost:250,col:'#a379ff',dmg:118,rate:1.75,range:5.0,kind:'beam',pierceArmor:true,
    blurb:'Slow and expensive. Ignores armour entirely, so it is your answer to the frozen middle.'},
  killswitch:{name:'Kill switch',cost:360,col:'#ff6b6b',dmg:175,rate:4.5,range:2.7,kind:'nova',nova:2.3,stun:1.3,
    blurb:'Detonates a whole area and stuns the survivors. One is a plan, three is a budget problem.'}
};
const TKEYS=Object.keys(TOWERS);
TKEYS.forEach(k=>TOWERS[k].key=k);

const NOTES={
 evalsuite:{
  tags:['single target','2\u00d7 hallucinations','beats eval gap'],
  good:'Hallucinations, confident citations, and the eval gap, which ignores every other defence. Cheap enough to build three of.',
  weak:'Armour. Eight damage a shot means the frozen middle and legacy models take one point per hit.',
  hint:'Place early, place several. Long stretches of lane suit it because it fires four times a second.'},
 guardrail:{
  tags:['slows 50%','2.2s duration','low damage'],
  good:'Holding a crowd inside somebody else\u2019s kill zone. It multiplies every tower around it.',
  weak:'GPU quota, data swamp, red team findings, CEO mandates and the audit boss all ignore slows completely.',
  hint:'Worthless alone. Put it just before a cluster of damage, not at the end of the lane.'},
 observ:{
  tags:['splash 1.0','reveals invisible','area damage'],
  good:'Shadow AI, sub-agents and any wave that arrives in volume. Nothing else on the board can even target a cloaked threat.',
  weak:'Silent regression is immune to splash. Its damage is wasted on single armoured targets.',
  hint:'You need at least one covering the lane by era two, and its reveal only works inside its own range.'},
 router:{
  tags:['chains 4','\u221226% per jump','crowd damage'],
  good:'Dense packs moving together. Four arcs from one shot is the best focus-per-damage on the board.',
  weak:'Chains skip silent regression and anything invisible. Against a lone boss it is a weak single target tower.',
  hint:'Put it where the lane doubles back, so one shot can reach two rows of threats at once.'},
 council:{
  tags:['ignores armour','5 cell range','slow rate'],
  good:'The frozen middle, the model nobody retires, and every boss. Armour is subtracted before damage for everyone else, not for this.',
  weak:'Data residency is built to survive pierce, so its ten armour still applies. One shot every 1.75 seconds means swarms walk past it.',
  hint:'Its five cell range covers several bends. Place it centrally rather than beside the lane.'},
 killswitch:{
  tags:['nova 2.3','1.3s stun','very expensive'],
  good:'A lane about to break. It detonates everything in the blast and stuns the survivors long enough to recover.',
  weak:'Silent regression takes nothing from it, and bosses are immune to the stun. One shot every 4.5 seconds.',
  hint:'Buy it last. Position it over the section that leaks, not the section you are already holding.'}
};

/* ===================== threats ===================== */
const E={
/* era 1 */
hallu:{n:'Hallucination',hp:78,spd:1.5,b:15,dmg:2,c:'#ff63c7',shape:'ghost',fam:'hallu',split:['citation',2],
  d:'Splits into two confident citations when killed. Eval suites hit it twice as hard.'},
citation:{n:'Confident citation',hp:26,spd:2.3,b:3,dmg:1,c:'#ff9ee6',shape:'wisp',fam:'hallu',sz:.26,
  d:'Fast, wrong, and completely sure of itself.'},
ctx:{n:'Context switch',hp:22,spd:2.7,b:4,dmg:1,c:'#7fd4ff',shape:'ctx',sz:.3,weave:.55,
  d:'Weaves down the lane at speed. Cheap alone, ruinous in a crowd.'},
token:{n:'Token burn',hp:66,spd:1.7,b:12,dmg:1,c:'#ffa03c',shape:'flame',drain:4,
  d:'Drains 4 focus every second it stays alive. Kill it early or pay for it.'},
pilot:{n:'Pilot purgatory',hp:150,spd:1.1,b:24,dmg:2,c:'#9fb4d6',shape:'halo',regen:18,
  d:'Heals 18 a second. Chip damage will never finish it, you need burst.'},
demo:{n:'Hype demo',hp:100,spd:1.4,b:16,dmg:1,c:'#ffe27a',shape:'demo',sz:.55,split:['months',3],
  d:'Dies easily and leaves three Six months later behind it.'},
months:{n:'Six months later',hp:200,spd:.9,b:24,dmg:2,c:'#b08a4a',shape:'months',armor:3,
  d:'The bill for the demo that went well. Slow, armoured, patient.'},
/* era 2 */
shadow:{n:'Shadow AI',hp:105,spd:1.8,b:20,dmg:2,c:'#6b5cff',shape:'shadow',cloak:true,
  d:'Untargetable until an observability grid has it in range. Nothing else can even see it.'},
sprawl:{n:'Agent sprawl',hp:175,spd:1.2,b:32,dmg:2,c:'#4be0a8',shape:'sprawl',spawn:['subagent',2.6],
  d:'Spawns a sub-agent every 2.6 seconds, forever, until you kill the parent.'},
subagent:{n:'Sub-agent',hp:34,spd:2.1,b:3,dmg:1,c:'#8ff0cc',shape:'sprawl',sz:.24,
  d:'Nobody registered it and nobody owns it.'},
gpu:{n:'GPU quota denied',hp:300,spd:1.0,b:44,dmg:2,c:'#ff4d5e',shape:'chip',armor:7,slowProof:true,
  d:'Armoured and immune to slows. Guardrails do nothing here.'},
vendor:{n:'Vendor lock-in',hp:230,spd:1.1,b:38,dmg:2,c:'#c98bff',shape:'lock',aura:.45,
  d:'Everything within two cells of it takes 45% less damage. Kill it first or kill nothing.'},
evalgap:{n:'Eval gap',hp:190,spd:1.3,b:34,dmg:2,c:'#8fd0ff',shape:'evalgap',onlyEval:true,
  d:'Takes 65% less damage from every defence except the eval suite. You cannot fix what you do not measure.'},
roi:{n:'ROI demand',hp:70,spd:2.0,b:12,dmg:3,c:'#ffd84b',shape:'roi',
  d:'Fast, and costs three sanity if it reaches you.'},
/* era 3 */
inject:{n:'Prompt injection',hp:130,spd:1.6,b:22,dmg:2,c:'#ff4d7a',shape:'inject',hijack:true,
  d:'Hijacks any defence it walks past for four seconds. Do not line your towers along one stretch.'},
swamp:{n:'Data swamp',hp:360,spd:.85,b:46,dmg:3,c:'#7a8f52',shape:'swamp',armor:5,slowProof:true,sludge:true,
  d:'Leaves sludge that makes every tower standing in it fire 70% slower.'},
deprec:{n:'Deprecation notice',hp:150,spd:1.5,b:24,dmg:2,c:'#ff7a3c',shape:'sunset',sunset:true,

let AC=null,sndOn=true,lastS=0;
function tone(f,d,t,v,to){
  if(!sndOn)return;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=t||'square';o.frequency.setValueAtTime(f,AC.currentTime);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(30,to),AC.currentTime+d);
  g.gain.setValueAtTime(.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(v||.05,AC.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.03);
}

function paint(){
  bg=document.createElement('canvas');bg.width=Math.round(W*dpr);bg.height=Math.round(H*dpr);
  const b=bg.getContext('2d');b.setTransform(dpr,0,0,dpr,0,0);
  const g=b.createLinearGradient(0,0,W*.5,H);
  g.addColorStop(0,'#0b1322');g.addColorStop(.45,'#070d1a');g.addColorStop(1,'#04070e');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  const a1=b.createRadialGradient(W*.12,-H*.12,0,W*.12,-H*.12,H*.75);
  a1.addColorStop(0,'rgba(163,121,255,.22)');a1.addColorStop(1,'rgba(163,121,255,0)');
  b.fillStyle=a1;b.fillRect(0,0,W,H);
  const a2=b.createRadialGradient(W*1.08,H*1.06,0,W*1.08,H*1.06,H*.66);
  a2.addColorStop(0,'rgba(53,230,213,.16)');a2.addColorStop(1,'rgba(53,230,213,0)');
  b.fillStyle=a2;b.fillRect(0,0,W,H);

  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    if(pathKeys.has(c+','+r))continue;
    const x=(c+.5)*cell,y=(r+.5)*cell,s=cell*.3;
    b.strokeStyle='rgba(125,165,220,.11)';b.lineWidth=1;
    b.beginPath();
    for(let i=0;i<6;i++){const a=i/6*6.283-1.5708;i?b.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s):b.moveTo(x+Math.cos(a)*s,y+Math.sin(a)*s)}
    b.closePath();b.stroke();
    b.fillStyle='rgba(125,165,220,.07)';b.beginPath();b.arc(x,y,1.2,0,6.3);b.fill();
  }
  const trace=()=>{b.beginPath();b.moveTo(WP[0].x,WP[0].y);for(let i=1;i<WP.length;i++)b.lineTo(WP[i].x,WP[i].y)};
  b.lineCap='round';b.lineJoin='round';
  trace();b.strokeStyle='#02050c';b.lineWidth=cell*1.0;b.stroke();
  trace();b.strokeStyle='#0e1830';b.lineWidth=cell*.84;b.stroke();
  const pg=b.createLinearGradient(0,0,W,H);
  pg.addColorStop(0,'rgba(163,121,255,.18)');pg.addColorStop(1,'rgba(53,230,213,.18)');
  trace();b.strokeStyle=pg;b.lineWidth=cell*.84;b.stroke();
  trace();b.strokeStyle='rgba(130,205,240,.24)';b.lineWidth=1.2;b.stroke();
  b.save();b.globalAlpha=.2;b.strokeStyle='#3a5d84';b.lineWidth=1;
  for(let i=0;i<WP.length-1;i++){
    const a=WP[i],c2=WP[i+1],L=SEG[i],ux=(c2.x-a.x)/L,uy=(c2.y-a.y)/L;
    for(let d=cell*.4;d<L;d+=cell*.44){
      const x=a.x+ux*d,y=a.y+uy*d,px=-uy*cell*.31,py=ux*cell*.31;
      b.beginPath();b.moveTo(x-px,y-py);b.lineTo(x+px,y+py);b.stroke();
    }
  }
  b.restore();
  const i0=WP[0],o0=WP[WP.length-1];
  b.font='600 '+(cell*.3)+'px Sora, sans-serif';b.textBaseline='middle';
  b.textAlign='left';b.fillStyle='rgba(255,107,107,.8)';b.fillText('inbound',3,i0.y-cell*.66);
  b.textAlign='right';b.fillStyle='rgba(53,230,213,.85)';b.fillText('you',W-3,o0.y-cell*.66);
  const v=b.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.82);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.52)');
  b.fillStyle=v;b.fillRect(0,0,W,H);
}

/* ===================== helpers ===================== */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function poly(c,n,r,rot){c.beginPath();for(let i=0;i<n;i++){const a=i/n*6.283+(rot||0);i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath()}
function at(d){let x=d;
  for(let i=0;i<SEG.length;i++){
    if(x<=SEG[i]){const a=WP[i],b=WP[i+1],t=x/SEG[i];
      return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,ang:Math.atan2(b.y-a.y,b.x-a.x),nx:-(b.y-a.y)/SEG[i],ny:(b.x-a.x)/SEG[i]}}
    x-=SEG[i]}
  const l=WP[WP.length-1];return{x:l.x,y:l.y,ang:0,nx:0,ny:0}}
function burst(x,y,c,n,sp,life){
  for(let i=0;i<n;i++){if(S.parts.length>360)return;
    const a=Math.random()*6.283,s=sp*(.35+Math.random());
    S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life||.5,m:life||.5,c,r:1+Math.random()*2.4})}}
function say(x,y,txt,c,sz){S.floats.push({x,y,txt,c,l:1,sz:sz||cell*.3})}

}
function auraDr(f){
  let dr=0;
  for(const o of S.foes){if(o===f||o.dead||!o.def.aura)continue;
    if(Math.hypot(o.x-f.x,o.y-f.y)<cell*2.2)dr=Math.max(dr,o.def.aura)}
  return dr;
}
function hurt(f,amt,src){
  if(f.dead)return;
  let d=amt;
  if(src&&src.bonusFam&&f.def.fam===src.bonusFam)d*=src.bonus;
  if(f.def.onlyEval&&!(src&&src.key==='evalsuite'))d*=.35;
  const dr=auraDr(f);if(dr)d*=(1-dr);
  if(f.def.armor){
    const pierce=src&&src.pierceArmor&&!f.def.antiPierce;
    if(!pierce)d=Math.max(1,d-f.def.armor);
  }
  if(!f.shown){f.shown=true;f.spd*=1.5;say(f.x,f.y-cell*.6,'not actually AI','#d8c4ff',cell*.28)}
  if(f.shield>0){f.shield-=d;f.shT=0;f.fl=.1;if(f.shield<0){d=-f.shield;f.shield=0}else return}
  f.hp-=d;f.fl=.12;
  if(f.hp<=0)slay(f);
}
function slay(f){
  if(f.dead)return;
  f.dead=true;S.killed++;S.focus+=f.b;
  say(f.x,f.y-cell*.5,'+'+f.b,'#35e6d5');
  burst(f.x,f.y,f.def.c,f.def.boss?52:11,cell*3.4,.55);
  S.fx.push({k:'shock',x:f.x,y:f.y,l:.42,m:.42,r:cell*(f.def.boss?3.6:1.1),c:f.def.c});
  S.fx.push({k:'implode',x:f.x,y:f.y,l:.3,m:.3,r:cell*1.4,c:f.def.c});
  sfx.die();
  if(f.def.split){const[kk,n]=f.def.split;for(let i=0;i<n;i++)add(kk,Math.max(0,f.d-cell*.3*i))}
  if(f.def.boss){S.shake=18;S.boss=null;flash('#fff',.45);S.focus+=180}
}
function nearestTower(x,y,rad){
  let best=null,bd=1e9;
  for(const t of S.towers){const d=Math.hypot(t.x-x,t.y-y);
    if(rad&&d>rad*cell)continue;if(d<bd){bd=d;best=t}}
  return best;
}
function pFreeze(f){
  let n=0;
  for(const t of S.towers)if(Math.hypot(t.x-f.x,t.y-f.y)<cell*3.7){t.stunT=Math.max(t.stunT,4.2);t.kind='freeze';n++}
  if(n){S.fx.push({k:'pulse',x:f.x,y:f.y,l:.7,m:.7,r:cell*3.7,c:'#ffd84b'});
    say(f.x,f.y-cell,'budget freeze','#ffd84b',cell*.32);sfx.power();S.shake=8;flash('#ffd84b',.25)}
}
function pDestroy(f){
  const t=nearestTower(f.x,f.y,4.6);
  if(!t){say(f.x,f.y-cell,'nothing to audit','#5c8dff',cell*.28);return}
  S.towers=S.towers.filter(x=>x!==t);
  if(S.sel===t){S.sel=null;inspect.classList.remove('show')}
  S.lost++;
  burst(t.x,t.y,'#5c8dff',30,cell*3.6,.7);
  S.fx.push({k:'shock',x:t.x,y:t.y,l:.5,m:.5,r:cell*1.8,c:'#5c8dff'});
  S.fx.push({k:'wreck',x:t.x,y:t.y,l:2.8,m:2.8,c:'#5c8dff'});
  say(t.x,t.y-cell*.5,'non-compliant','#5c8dff',cell*.3);
  sfx.wreck();S.shake=14;flash('#5c8dff',.32);
}
function pHijack(f){
  const l=S.towers.slice().sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y)).slice(0,3);
  for(const t of l){t.stunT=Math.max(t.stunT,6);t.kind='hijack'}
  if(l.length){S.fx.push({k:'pulse',x:f.x,y:f.y,l:.7,m:.7,r:cell*5,c:'#ff3b6b'});
    say(f.x,f.y-cell,'ignore previous instructions','#ff3b6b',cell*.28);sfx.power();S.shake=9;flash('#ff3b6b',.3)}
}
function pDowngrade(f){
  let n=0;
  for(const t of S.towers)if(Math.hypot(t.x-f.x,t.y-f.y)<cell*4.2&&t.lv>1){t.lv--;n++;
    S.fx.push({k:'pulse',x:t.x,y:t.y,l:.5,m:.5,r:cell*.9,c:'#a379ff'})}
  say(f.x,f.y-cell,n?'restructured':'nothing left to cut','#a379ff',cell*.3);
  if(n){sfx.power();S.shake=10;flash('#a379ff',.3)}
}
function touchTowers(f,rad,fn){
  for(const t of S.towers){
    if(f.marked.has(t))continue;
    if(Math.hypot(t.x-f.x,t.y-f.y)<cell*rad){f.marked.add(t);fn(t)}
  }
}
function stepFoes(dt){
  for(const f of S.foes){
    if(f.dead)continue;
    const D=f.def;
    if(f.fl>0)f.fl-=dt;
    if(f.revT>0)f.revT-=dt;
    if(D.regen&&f.hp<f.max)f.hp=Math.min(f.max,f.hp+D.regen*dt*scale());
    if(D.heal&&f.hp<f.max)f.hp=Math.min(f.max,f.hp+D.heal*dt);
    if(D.grow){f.max+=D.grow*dt;f.hp=Math.min(f.max,f.hp+D.grow*dt)}
    if(f.shMax){f.shT+=dt;if(f.shT>3&&f.shield<f.shMax)f.shield=Math.min(f.shMax,f.shield+f.shMax*.085*dt)}
    if(D.drain)S.focus=Math.max(0,S.focus-D.drain*dt);
    if(D.accel)f.acc=Math.min(2.0,f.acc+D.accel*dt);
    if(D.spawn){f.sT-=dt;if(f.sT<=0){f.sT=D.spawn[1];add(D.spawn[0],Math.max(0,f.d-cell*.5))}}
    if(D.power){f.pT-=dt;if(f.pT<=0){f.pT=D.pcd;
      ({freeze:pFreeze,destroy:pDestroy,hijack:pHijack,downgrade:pDowngrade})[D.power](f)}}
    if(D.phases){
      const p=f.hp/f.max;
      while(f.phase<D.phases.length&&p<D.phases[f.phase]){
        f.phase++;
        for(let i=0;i<4;i++)add('subagent',Math.max(0,f.d-cell*.4*i));
        add('hallu',Math.max(0,f.d-cell*.6));add('inject',Math.max(0,f.d-cell*.9));
        say(f.x,f.y-cell,'replicating','#ff3b6b',cell*.32);
        S.fx.push({k:'pulse',x:f.x,y:f.y,l:.7,m:.7,r:cell*4,c:'#ff3b6b'});S.shake=11;
      }
    }
    if(D.sludge){f.slT=(f.slT||0)-dt;if(f.slT<=0){f.slT=.9;if(S.sludge.length<26)S.sludge.push({x:f.x,y:f.y,r:cell*1.05,l:7,m:7})}}
    if(D.sunset)touchTowers(f,1.3,t=>{t.stunT=Math.max(t.stunT,5);t.kind='sunset';
      say(t.x,t.y-cell*.5,'sunset','#ff7a3c',cell*.26)});
    if(D.hijack)touchTowers(f,1.2,t=>{t.stunT=Math.max(t.stunT,4);t.kind='hijack';
      say(t.x,t.y-cell*.5,'injected','#ff4d7a',cell*.26)});
    if(D.page)touchTowers(f,1.2,t=>{t.stunT=Math.max(t.stunT,2.5);t.kind='paged';
      say(t.x,t.y-cell*.5,'paged','#ff9f43',cell*.26)});
    if(D.attrition)touchTowers(f,1.3,t=>{if(t.lv>1){t.lv--;say(t.x,t.y-cell*.5,'they left','#ffd0a0',cell*.26);
      S.fx.push({k:'pulse',x:t.x,y:t.y,l:.5,m:.5,r:cell*.9,c:'#ffd0a0'})}});

    let sp=f.spd*(1+(f.acc||0));
    if(f.stunT>0){f.stunT-=dt;sp=0}
    else if(f.slowT>0){f.slowT-=dt;sp*=(1-f.slowA)}
    f.d+=sp*dt;f.w+=dt*6;
    const p=at(f.d);
    let ox=0,oy=0;
    if(D.weave){const s=Math.sin(f.w*1.4)*cell*D.weave;ox=p.nx*s;oy=p.ny*s}
    f.x=p.x+ox;f.y=p.y+oy;f.ang=p.ang;
    if(D.spd>=2.0){f.tr.push({x:f.x,y:f.y});if(f.tr.length>5)f.tr.shift()}

    if(f.d>=TOTAL){
      f.dead=true;S.sanity-=D.dmg;S.leaked++;S.shake=Math.max(S.shake,D.dmg*2.4);
      sfx.leak();flash('#ff3b4e',.3);
      say(WP[WP.length-1].x-cell,WP[WP.length-1].y-cell*.6,'-'+D.dmg,'#ff6b6b',cell*.4);
      if(S.boss===f)S.boss=null;
      if(S.sanity<=0){S.sanity=0;lose()}
    }
  }
  S.foes=S.foes.filter(f=>!f.dead);
  for(const s of S.sludge)s.l-=dt;
  S.sludge=S.sludge.filter(s=>s.l>0);
}

/* ===================== towers ===================== */
function tAt(c,r){return S.towers.find(t=>t.c===c&&t.r===r)}
function st(t,k){
  const d=t.def,l=t.lv-1;
  if(k==='dmg')return d.dmg*Math.pow(1.55,l);
  if(k==='range')return d.range*Math.pow(1.1,l)*cell;
  if(k==='rate'){
    let r=d.rate*Math.pow(.9,l);
    for(const s of S.sludge)if(Math.hypot(s.x-t.x,s.y-t.y)<s.r){r*=1.7;break}
    for(const f of S.foes)if(f.def.towerSlow&&!f.dead&&Math.hypot(f.x-t.x,f.y-t.y)<cell*3){r*=1.8;break}
    return r;
  }
  return 0;
}
function upCost(t){return Math.round(t.def.cost*.9*t.lv)}
function build(k,c,r){
  const d=TOWERS[k];
  if(S.focus<d.cost)return false;
  S.focus-=d.cost;
  S.towers.push({key:k,def:d,c,r,x:(c+.5)*cell,y:(r+.5)*cell,lv:1,cd:d.rate,ang:-1.5708,
    spent:d.cost,rec:0,stunT:0,kind:'',spin:Math.random()*6});
  sfx.build();burst((c+.5)*cell,(r+.5)*cell,d.col,12,cell*2,.4);
  S.fx.push({k:'pulse',x:(c+.5)*cell,y:(r+.5)*cell,l:.45,m:.45,r:d.range*cell,c:d.col});
  return true;
}
function target(t,R,kind){
  let best=null,bd=-1;
  for(const f of S.foes){
    if(f.dead)continue;
    if(f.def.cloak&&f.revT<=0)continue;
    if(f.def.noAoE&&(kind==='chain'||kind==='nova'))continue;
    const dx=f.x-t.x,dy=f.y-t.y;
    if(dx*dx+dy*dy<=R*R&&f.d>bd){bd=f.d;best=f}
  }
  return best;
}
function stepTowers(dt){
  for(const t of S.towers){
    t.spin+=dt*(t.key==='observ'?.9:.35);
    if(t.stunT>0){t.stunT-=dt;t.cd=Math.max(t.cd,.25);continue}
    const R=st(t,'range');
    if(t.def.reveal)for(const f of S.foes)if(f.def.cloak&&Math.hypot(f.x-t.x,f.y-t.y)<R)f.revT=.4;
    t.cd-=dt;if(t.rec>0)t.rec-=dt*5;
    const tg=target(t,R,t.def.kind);
    if(!tg)continue;
    const want=Math.atan2(tg.y-t.y,tg.x-t.x);
    t.ang+=(((want-t.ang+9.4248)%6.28318)-Math.PI)*Math.min(1,dt*14);
    if(t.cd>0)continue;
    t.cd=st(t,'rate');t.rec=1;
    const d=t.def,dmg=st(t,'dmg');
    const mx=t.x+Math.cos(t.ang)*cell*.36,my=t.y+Math.sin(t.ang)*cell*.36;
    S.fx.push({k:'muzzle',x:mx,y:my,ang:t.ang,l:.09,m:.09,c:d.col});
    sfx.shoot();
    if(d.kind==='beam'){
      S.fx.push({k:'beam',x1:mx,y1:my,x2:tg.x,y2:tg.y,l:.2,m:.2,c:d.col});
      hurt(tg,dmg,d);burst(tg.x,tg.y,d.col,7,cell*2.4,.35);sfx.hit();
    }else if(d.kind==='nova'){
      const rad=d.nova*cell;
      S.fx.push({k:'shock',x:tg.x,y:tg.y,l:.5,m:.5,r:rad,c:d.col});
      S.fx.push({k:'pulse',x:tg.x,y:tg.y,l:.45,m:.45,r:rad,c:d.col});
      for(const f of S.foes){if(f.dead||f.def.noAoE)continue;
        if(Math.hypot(f.x-tg.x,f.y-tg.y)<=rad){hurt(f,dmg,d);if(!f.dead&&!f.def.boss)f.stunT=Math.max(f.stunT,d.stun)}}
      burst(tg.x,tg.y,d.col,24,cell*4,.5);S.shake=Math.max(S.shake,5);sfx.nova();
    }else if(d.kind==='chain'){
      let cur=tg,used=[cur],px=mx,py=my,dd=dmg;
      for(let i=0;i<d.chain;i++){
        S.fx.push({k:'bolt',x1:px,y1:py,x2:cur.x,y2:cur.y,l:.2,m:.2,c:d.col,s:Math.random()*99});
        hurt(cur,dd,d);dd*=d.falloff;px=cur.x;py=cur.y;
        let nx=null,nb=cell*2.5;
        for(const f of S.foes){if(f.dead||used.includes(f)||f.def.noAoE)continue;
          if(f.def.cloak&&f.revT<=0)continue;
          const q=Math.hypot(f.x-px,f.y-py);if(q<nb){nb=q;nx=f}}
        if(!nx)break;cur=nx;used.push(cur);
      }
      sfx.hit();
    }else{
      S.shots.push({x:mx,y:my,tg,dmg,c:d.col,v:d.vel*cell,sp:d.splash?d.splash*cell:0,
        slow:d.slow||0,sd:d.slowDur||0,src:d,r:d.splash?cell*.17:cell*.09,tr:[]});
    }
  }
}
function stepShots(dt){
  for(const s of S.shots){
    const tx=s.tg&&!s.tg.dead?s.tg.x:s.lx, ty=s.tg&&!s.tg.dead?s.tg.y:s.ly;
    if(tx===undefined){s.dead=true;continue}
    s.lx=tx;s.ly=ty;
    const dx=tx-s.x,dy=ty-s.y,D=Math.hypot(dx,dy),step=s.v*dt;
    s.tr.push({x:s.x,y:s.y});if(s.tr.length>6)s.tr.shift();
    if(D<=step){
      s.dead=true;
      if(s.sp){
        S.fx.push({k:'shock',x:tx,y:ty,l:.32,m:.32,r:s.sp,c:s.c});
        for(const f of S.foes)if(!f.dead&&!f.def.noAoE&&Math.hypot(f.x-tx,f.y-ty)<=s.sp)land(f,s);
        burst(tx,ty,s.c,13,cell*3,.4);
      }else if(s.tg&&!s.tg.dead){land(s.tg,s);burst(tx,ty,s.c,5,cell*1.8,.28)}
      sfx.hit();
    }else{s.x+=dx/D*step;s.y+=dy/D*step}
  }
  S.shots=S.shots.filter(s=>!s.dead);
}
function land(f,s){
  hurt(f,s.dmg,s.src);
  if(s.slow&&!f.def.slowProof&&!f.dead){f.slowT=s.sd;f.slowA=Math.max(f.slowA,s.slow)}
}

/* ===================== waves ===================== */
function waveList(n){
  if(n<=WAVES.length)return WAVES[n-1].g;
  const en=n-WAVES.length;
  const pool=['hallu','shadow','drift','vendor','gpu','frozen','inject','pii','swamp','sprawl',
    'evalgap','silent','residency','oncall','redteam','attrition','energy','inferbill','trust','mandate','legacyai'];
  const g=[];
  const kinds=Math.min(6,3+Math.floor(en/2));
  const seen=[];
  for(let i=0;i<kinds;i++){
    let k=pool[Math.floor(Math.random()*pool.length)],guard=0;
    while(seen.includes(k)&&guard++<12)k=pool[Math.floor(Math.random()*pool.length)];
    seen.push(k);
    g.push([k,4+Math.floor(en*.7),1.4,i*1.5]);
  }
  if(en%3===0)g.push([['review','board','audit','reorg','rogue'][Math.floor(en/3)%5],1,1,3]);
  return g;
}
function waveTitle(n){return n<=WAVES.length?WAVES[n-1].t:'Endless '+(n-WAVES.length)+' · it does not stop'}
function waveEra(n){return n<=WAVES.length?ERAS[WAVES[n-1].e]:{n:'Beyond the campaign',s:'Every era at once, permanently scaling.'}}
function makeQueue(n){
  const q=[];
  for(const[k,c,gap,a0]of waveList(n))for(let i=0;i<c;i++)q.push({k,t:(a0||0)+i*gap});
  return q.sort((a,b)=>a.t-b.t);
}
function startWave(){
  if(S.phase!=='build')return;
  const bonus=Math.round(Math.max(0,S.buildT)*4);
  if(bonus>0){S.focus+=bonus;say(W/2,H*.55,'+'+bonus+' banked','#35e6d5',cell*.34)}
  S.queue=makeQueue(S.wave);S.phase='wave';S.t=0;
  S.banner={txt:waveTitle(S.wave),sub:'wave '+S.wave,l:2.8};
  callRow.classList.add('hidden');hud();
}
function stepWave(dt){
  S.t+=dt;
  while(S.queue.length&&S.queue[0].t<=S.t)add(S.queue.shift().k,0);
  if(!S.queue.length&&!S.foes.length){
    const rew=45+S.wave*8;S.focus+=rew;
    say(W/2,H*.44,'wave clear  +'+rew,'#6ee7a0',cell*.4);
    S.best=Math.max(S.best,S.wave);
    if(!S.endless&&S.wave%5===0&&S.wave<WAVES.length){
      const got=PLAYBOOK.filter(p=>p[0]===S.wave/5-1).length;
      say(W/2,H*.52,got+' counters unlocked','#a379ff',cell*.34);
      say(W/2,H*.58,(WAVES.length-S.wave)+' waves to the playbook','#35e6d5',cell*.3);
      flash('#a379ff',.35);
    }
    if(S.wave>=WAVES.length&&!S.endless){lessons();return}
    nextBrief();
  }
}
function nextBrief(){
  S.wave++;
  if(S.wave>WAVES.length)S.endless=S.wave-WAVES.length;
  S.sludge.length=0;S.phase='brief';
  briefing();
}

/* ===================== threat artwork ===================== */
function face(x,y,r,ang,col){
  const ox=Math.cos(ang)*r*.13,oy=Math.sin(ang)*r*.13;
  ctx.fillStyle='#050912';
  ctx.beginPath();ctx.arc(x-r*.28,y,r*.2,0,6.3);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*.28,y,r*.2,0,6.3);ctx.fill();
  ctx.fillStyle=col||'#fff';
  ctx.beginPath();ctx.arc(x-r*.28+ox,y+oy,r*.085,0,6.3);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*.28+ox,y+oy,r*.085,0,6.3);ctx.fill();
}
const SHAPE={
ghost(s,f,c){ctx.beginPath();ctx.arc(0,-s*.18,s*.85,Math.PI,0);ctx.lineTo(s*.85,s*.5);
  for(let i=0;i<3;i++){const a=s*.85-i*s*.567;ctx.quadraticCurveTo(a-s*.28,s*.5+(i%2?-s*.3:s*.32),a-s*.567,s*.5)}
  ctx.lineTo(-s*.85,-s*.18);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.shadowBlur=0;
  face(0,-s*.22,s,f.ang+Math.sin(f.w)*1.6,'#ffd6f4')},
wisp(s,f,c){ctx.fillStyle=c;ctx.globalAlpha=.92;
  ctx.beginPath();ctx.ellipse(0,0,s*.9,s*.7,Math.sin(f.w)*.3,0,6.3);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
  ctx.fillStyle='#3a0d2c';ctx.font='700 '+(s*.95)+'px Sora, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('"',0,s*.18)},
ctx(s,f,c){ctx.strokeStyle=c;ctx.lineWidth=s*.3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-s*.8,-s*.55);ctx.lineTo(s*.8,s*.55);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*.8,s*.55);ctx.lineTo(s*.8,-s*.55);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(s*.8,s*.55,s*.24,0,6.3);ctx.fill();
  ctx.beginPath();ctx.arc(s*.8,-s*.55,s*.24,0,6.3);ctx.fill()},
flame(s,f,c){const w=Math.sin(f.w*1.6)*.16;ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(0,-s*1.15);ctx.quadraticCurveTo(s*(.85+w),-s*.1,s*.5,s*.6);
  ctx.quadraticCurveTo(0,s*1.05,-s*.5,s*.6);ctx.quadraticCurveTo(-s*(.85-w),-s*.1,0,-s*1.15);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff3d0';
  ctx.beginPath();ctx.moveTo(0,-s*.4);ctx.quadraticCurveTo(s*.3,s*.05,0,s*.5);ctx.quadraticCurveTo(-s*.3,s*.05,0,-s*.4);ctx.fill();

/* ===================== loop ===================== */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;
  if(S.phase==='wave'||S.phase==='build')step(dt);
  render(dt);
}
function step(dt){
  stepFoes(dt);stepTowers(dt);stepShots(dt);
  if(S.phase==='wave')stepWave(dt);
  else{S.buildT-=dt;callBonus.textContent=S.buildT>0?'+'+Math.round(S.buildT*4):'';
    if(S.buildT<=0)startWave()}
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*24);
  if(S.flashT>0)S.flashT-=dt;
  hud();
}
function render(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(S.shake>0)ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  if(bg)ctx.drawImage(bg,0,0,W,H);
  drawSky(dt);drawSludge();drawFlow(dt);drawPlots();
  for(const t of S.towers)drawTower(t);
  for(const f of S.foes)drawFoe(f);
  for(const s of S.shots){
    ctx.globalAlpha=.32;ctx.fillStyle=s.c;
    for(let i=0;i<s.tr.length;i++){ctx.beginPath();ctx.arc(s.tr[i].x,s.tr[i].y,s.r*(i/s.tr.length)*.95,0,6.3);ctx.fill()}
    ctx.globalAlpha=1;
    ctx.shadowColor=s.c;ctx.shadowBlur=10;ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r*.42,0,6.3);ctx.fill();ctx.shadowBlur=0;
  }
  drawFx(dt);drawParts(dt);drawFloats(dt);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBossBar();drawBanner(dt);
  if(S.flashT>0&&S.flashCol){
    ctx.globalAlpha=Math.min(.3,S.flashT*.7);ctx.fillStyle=S.flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
  const low=1-S.sanity/S.max;
  if(low>.5){
    const v=ctx.createRadialGradient(W/2,H/2,H*.26,W/2,H/2,H*.62);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,'rgba(255,40,60,'+((low-.5)*.55+Math.sin(clock*3)*.03)+')');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }
}

/* ===================== hud + shop ===================== */
let hkey='';
function hud(){
  const k=S.sanity+'|'+Math.floor(S.focus)+'|'+S.wave+'|'+S.towers.length;
  if(k===hkey)return;hkey=k;
  el('sanityVal').textContent=S.sanity;
  el('focusVal').textContent=Math.floor(S.focus);
  el('waveVal').textContent=S.wave+'/'+(S.endless?'\u221e':WAVES.length);
  el('sanityFill').style.width=(S.sanity/S.max*100)+'%';
  callBtn.querySelector('span').textContent='Start wave '+S.wave;
  for(const b of shop.children){
    const d=TOWERS[b.dataset.k];
    b.classList.toggle('poor',S.focus<d.cost);
    b.classList.toggle('sel',S.build===b.dataset.k);
  }
  if(S.sel)fillInspect();
  if(S.build&&el('preview').classList.contains('show'))showPreview(S.build);
}

function makeShop(){

/* ===================== briefing ===================== */
function thumb(key,px){
  const c=document.createElement('canvas');c.width=px*2;c.height=px*2;
  const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);
  const old=ctx;ctx=g;
  const D=E[key];
  g.translate(px/2,px/2);
  g.shadowColor=D.c;g.shadowBlur=7;
  const s=px*(D.boss?.3:.34);
  try{(SHAPE[D.shape]||SHAPE.ghost)(s,{w:1.3,ang:.4,revT:1,fl:0,shown:true},D.c)}catch(e){}
  ctx=old;
  return c.toDataURL();
}
function tagsFor(D){
  const t=[];
  if(D.boss)t.push(['boss',1]);
  if(D.armor)t.push(['armour '+D.armor,D.armor>=10]);
  if(D.antiPierce)t.push(['pierce proof',1]);
  if(D.onlyEval)t.push(['eval only',1]);
  if(D.noAoE)t.push(['single target only',1]);
  if(D.cloak)t.push(['invisible',1]);
  if(D.slowProof)t.push(['ignores slows',0]);
  if(D.aura)t.push(['shields allies',1]);
  if(D.regen||D.heal)t.push(['self heals',0]);
  if(D.grow)t.push(['grows',0]);
  if(D.drain)t.push(['drains focus',1]);
  if(D.split)t.push(['splits',0]);
  if(D.spawn)t.push(['spawns',0]);
  if(D.hijack||D.sunset||D.page||D.attrition||D.power)t.push(['attacks your defences',1]);
  if(D.towerSlow||D.sludge)t.push(['slows your defences',1]);
  if(D.mimic)t.push(['disguised',1]);
  if(D.dmg>=4)t.push([D.dmg+' sanity',1]);
  if(D.spd>=2.2)t.push(['very fast',0]);
  return t;
}
function briefing(){
  const n=S.wave, era=waveEra(n), list=waveList(n);
  const seen=[];
  for(const[k]of list)if(!seen.includes(k))seen.push(k);
  const extra=[];
  for(const k of seen){
    const D=E[k];
    if(D.split&&!seen.includes(D.split[0])&&!extra.includes(D.split[0]))extra.push(D.split[0]);
    if(D.spawn&&!seen.includes(D.spawn[0])&&!extra.includes(D.spawn[0]))extra.push(D.spawn[0]);
  }
  const rows=seen.concat(extra).map(k=>{
    const D=E[k];
    const tg=tagsFor(D).map(([t,h])=>'<em class="'+(h?'hot':'')+'">'+t+'</em>').join('');
    return '<div class="foe"><img src="'+thumb(k,38)+'" alt=""><div><div class="fn">'+D.n+
      (extra.includes(k)?' <span style="color:#7d92b5;font-weight:400">(arrives later)</span>':'')+
      '</div><div class="fd">'+D.d+'</div><div class="tg">'+tg+'</div></div></div>';
  }).join('');
  const mods=S.endless?'<p class="lore">Endless '+S.endless+'. Every threat has '+
    Math.round((scale()-1)*100)+'% more health than the base and the mix is randomised.</p>':'';
  const eras=erasCleared();
  const unlock=S.endless?'':
    (n%5===0?'<p class="lore">Boss wave. Clear it and <b>'+
      PLAYBOOK.filter(p=>p[0]===Math.floor((n-1)/5)).length+' more counters</b> unlock in your playbook.</p>'
     :'<p class="lore">'+PLAYBOOK.filter(p=>p[0]<eras).length+' of '+PLAYBOOK.length+
      ' counters unlocked. The next set opens when you clear wave '+(Math.floor((n-1)/5)+1)*5+'.</p>');
  ovBox.innerHTML=
    '<div class="eyebrow"><b>'+era.n+'</b><i></i><s>wave '+n+(S.endless?'':' of '+WAVES.length)+'</s></div>'+
    (S.endless?'':progressHTML())+
    '<h1 style="font-size:24px;margin-bottom:8px">'+waveTitle(n)+'</h1>'+
    '<p class="kick">'+era.s+'</p>'+mods+unlock+
    '<div style="margin-bottom:14px">'+rows+'</div>'+
    '<button id="deploy">Build defences</button>';
  hidePreview();ov.classList.add('show');ovScroll.scrollTop=0;
  el('deploy').onclick=()=>{
    ov.classList.remove('show');S.phase='build';S.buildT=BUILD_TIME;
    callRow.classList.remove('hidden');hkey='';hud();
  };
}

function shareCard(){
  const w=1080,h=1350,c=document.createElement('canvas');
  c.width=w;c.height=h;const g=c.getContext('2d');
  const bgg=g.createLinearGradient(0,0,w*.6,h);
  bgg.addColorStop(0,'#0c1424');bgg.addColorStop(.5,'#070d1a');bgg.addColorStop(1,'#04070e');

  a1.addColorStop(0,'rgba(163,121,255,.32)');a1.addColorStop(1,'rgba(163,121,255,0)');
  g.fillStyle=a1;g.fillRect(0,0,w,h);
  const a2=g.createRadialGradient(w,h,0,w,h,h*.6);
  a2.addColorStop(0,'rgba(53,230,213,.22)');a2.addColorStop(1,'rgba(53,230,213,0)');
  g.fillStyle=a2;g.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){g.globalAlpha=.05+Math.random()*.16;g.fillStyle='#cfe6ff';
    g.beginPath();g.arc(Math.random()*w,Math.random()*h,1+Math.random()*2,0,6.3);g.fill()}
  g.globalAlpha=1;
  g.textAlign='left';
  g.fillStyle='#7d92b5';g.font='600 30px Sora, sans-serif';
  g.fillText('head of ai \u00b7 defence',88,140);
  const reached=S.best||S.wave;
  const era=waveEra(Math.min(reached,WAVES.length));
  g.fillStyle='#e9effb';g.font='700 190px Sora, sans-serif';
  g.fillText('wave '+reached,80,320);
  g.fillStyle='#a379ff';g.font='600 40px Sora, sans-serif';
  g.fillText(era.n,88,392);
  g.fillStyle='#9db0cd';g.font='400 36px Sora, sans-serif';
  const title=reached<=WAVES.length?waveTitle(reached):'Endless '+(reached-WAVES.length);
  let line='',ly=460;
  for(const wd of title.split(' ')){
    if(g.measureText(line+' '+wd).width>w-180){g.fillText(line,88,ly);ly+=48;line=wd}
    else line=line?line+' '+wd:wd}
  g.fillText(line,88,ly);
  const cards=[['handled',S.killed,'#35e6d5'],['got through',S.leaked,'#ff6b6b'],['defences lost',S.lost,'#a379ff']];
  cards.forEach(([lbl,val,col],i)=>{
    const x=88+i*310,y=620;
    g.fillStyle='rgba(255,255,255,.04)';g.strokeStyle='rgba(43,61,94,.9)';g.lineWidth=2;
    const r=24;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+280,y,x+280,y+200,r);g.arcTo(x+280,y+200,x,y+200,r);
    g.arcTo(x,y+200,x,y,r);g.arcTo(x,y,x+280,y,r);g.closePath();g.fill();g.stroke();
    g.fillStyle=col;g.font='700 76px Sora, sans-serif';g.fillText(String(val),x+28,y+108);
    g.fillStyle='#7d92b5';g.font='500 26px Sora, sans-serif';g.fillText(lbl,x+28,y+158);
  });
  g.fillStyle='#e9effb';g.font='600 34px Sora, sans-serif';
  g.fillText('sanity left  '+S.sanity+' of '+S.max,88,920);
  g.fillStyle='rgba(43,61,94,.9)';g.fillRect(88,952,w-176,2);
  const picks=[...new Set(S.towers.map(t=>t.key))].slice(0,6);
  g.fillStyle='#7d92b5';g.font='500 28px Sora, sans-serif';
  g.fillText(picks.length?'defences standing at the end':'no defences left standing',88,1010);
  picks.forEach((k,i)=>{
    const d=TOWERS[k],x=88+(i%3)*310,y=1050+Math.floor(i/3)*70;
    g.fillStyle=d.col;g.beginPath();g.arc(x+14,y-10,13,0,6.3);g.fill();
    g.fillStyle='#c9d6ea';g.font='500 26px Sora, sans-serif';g.fillText(d.name,x+40,y);
  });
  g.fillStyle='#4d5f7d';g.font='500 24px Sora, sans-serif';
  g.fillText('how long could you hold the line?',88,h-70);
  c.toBlob(bl=>{
    if(!bl)return;
    const file=new File([bl],'head-of-ai-wave-'+reached+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Head of AI: defence'}).catch(()=>dl(bl,file.name));
    }else dl(bl,file.name);
  },'image/png');
}
function dl(bl,name){
  const u=URL.createObjectURL(bl),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},600);
}

/* ===================== input ===================== */
function canBuild(c,r){return c>=0&&c<COLS&&r>=0&&r<ROWS&&!pathKeys.has(c+','+r)&&!tAt(c,r)}
function cellOf(ev){const b=cv.getBoundingClientRect();
  return{c:Math.floor((ev.clientX-b.left)/cell),r:Math.floor((ev.clientY-b.top)/cell)}}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  if(!AC&&sndOn)tone(880,.02,'sine',.008);
  if(S.phase!=='wave'&&S.phase!=='build')return;
  hidePreview();
  const{c,r}=cellOf(ev),t=tAt(c,r);
  if(t){S.sel=t;S.build=null;hkey='';hud();inspect.classList.add('show');fillInspect();return}
  if(S.build&&canBuild(c,r)){
    if(!build(S.build,c,r))say((c+.5)*cell,(r+.5)*cell,'not enough focus','#ff6b6b',cell*.28);
    else if(S.focus<TOWERS[S.build].cost)S.build=null;
    hkey='';hud();return;
  }
  S.sel=null;inspect.classList.remove('show');
},{passive:false});
cv.addEventListener('pointermove',ev=>{ghost=S.build?cellOf(ev):null});
cv.addEventListener('pointerleave',()=>{ghost=null});

el('upBtn').addEventListener('click',()=>{
  const t=S.sel;if(!t||t.lv>=3)return;
  const c=upCost(t);if(S.focus<c)return;
  S.focus-=c;t.lv++;t.spent+=c;
  burst(t.x,t.y,t.def.col,16,cell*2.4,.5);sfx.build();
  say(t.x,t.y-cell*.55,'level '+t.lv,t.def.col,cell*.3);
  S.fx.push({k:'pulse',x:t.x,y:t.y,l:.45,m:.45,r:st(t,'range'),c:t.def.col});
  hkey='';hud();
});
el('sellBtn').addEventListener('click',()=>{
  const t=S.sel;if(!t)return;
  S.focus+=Math.floor(t.spent*.45);
  burst(t.x,t.y,'#7d92b5',12,cell*2,.4);
  S.towers=S.towers.filter(x=>x!==t);
  S.sel=null;inspect.classList.remove('show');hkey='';hud();
});
el('closeBtn').addEventListener('click',()=>{S.sel=null;inspect.classList.remove('show')});
el('pvX').addEventListener('click',()=>{S.build=null;hidePreview();hkey='';hud()});
callBtn.addEventListener('click',startWave);
el('briefBtn').addEventListener('click',()=>{if(S.phase==='build'){S.phase='brief';briefing()}});
el('sndBtn').addEventListener('click',e=>{sndOn=!sndOn;e.currentTarget.classList.toggle('on',sndOn)});
el('pauseBtn').addEventListener('click',()=>{
  if(S.phase==='wave'||S.phase==='build'){S.prev=S.phase;S.phase='paused';pauseScreen()}
});

  el('snap').onclick=shareCard;
}
function lessons(){
  S.phase='won';sfx.win();S.best=Math.max(S.best,WAVES.length);
  callRow.classList.add('hidden');inspect.classList.remove('show');
  ovBox.innerHTML=`<div class="eyebrow"><b>Campaign complete</b><i></i><s>25 of 25</s></div>
    <h1 style="font-size:27px">The playbook<em>${S.sanity} sanity left</em></h1>
    <p class="kick">Five eras held. Every counter is yours now, threat by threat.</p>
    ${statBlock()}
    <div style="margin-bottom:14px">${playbookHTML(5)}</div>
    <button id="endless">Continue forever</button>
    <button class="ghost" id="snap">Save result card</button>
    <button class="ghost" id="menu2">New game</button>`;
  hidePreview();ov.classList.add('show');ovScroll.scrollTop=0;
  el('endless').onclick=()=>{ov.classList.remove('show');nextBrief()};
  el('snap').onclick=shareCard;
  el('menu2').onclick=()=>{ov.classList.remove('show');menu()};
}

window.addEventListener('load',resize);
menu();
requestAnimationFrame(ts=>{last=ts;frame(ts)});

})();
</script>
</body>
</html>
