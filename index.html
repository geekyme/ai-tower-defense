<body>
<div id="app">
  <div id="hud">
    <div class="stat" id="sanityStat"><b id="sanityVal">16</b><span>sanity</span></div>
    <div class="stat" id="focusStat"><b id="focusVal">300</b><span>focus</span></div>
    <div class="stat" id="waveStat"><b id="waveVal">0/25</b><span>wave</span></div>
    <div class="grow"></div>
    <a class="iconbtn" href="lessons.html" id="bookBtn" title="Playbook" aria-label="Open the playbook">☰</a>
    <button class="iconbtn on" id="sndBtn" type="button" title="Sound" aria-label="Toggle sound and music">♪</button>
    <button class="iconbtn" id="pauseBtn" type="button" title="Pause" aria-label="Pause">❚❚</button>
  </div>
  <div id="sanityTrack"><div id="sanityFill"></div></div>

  <div id="stage">
    <canvas id="cv"></canvas>

    <!--
      The bottom dock. Everything that floats over the board stacks in here so
      the sheets never cover the call-wave row, and so the board keeps as much
      clear space as the screen can spare.
    -->
    <div id="dock">
      <!--
        The first run's walkthrough. Names the next tap, waits for it, and
        holds the build clock while it does. Shown once, ever.
      -->
      <div id="coach" hidden>
        <b id="coachNum"></b>
        <div class="ct">
          <strong id="coachTitle"></strong>
          <span id="coachBody"></span>
        </div>
        <button id="coachSkip" type="button">Skip</button>
      </div>

      <!--
        While a defence is selected and still homeless: where it goes, and how
        to read up on it. Takes no pointer events, so it never blocks a tap.
      -->
      <div id="placeHint" hidden>
        <span id="phMain"></span>
        <em id="phMore"><i>i</i>tap the card again for details</em>
      </div>

      <div id="callRow">
        <button id="briefBtn" type="button">Brief</button>
        <button id="callBtn" type="button"><span>Start wave 1</span><small id="callBonus"></small></button>
      </div>

      <!--
        What a defence does. Nothing covers the board while you are simply
        choosing where to put one: this opens only when you tap the card you
        already have selected, and any tap outside closes it again.
      -->
      <div id="preview">
        <div class="r1">
          <div id="pvDot"></div><div id="pvName"></div><div id="pvCost"></div>
          <button id="pvX" type="button" aria-label="Close">✕</button>
        </div>
        <div id="pvBlurb"></div>
        <div id="pvNums"></div>
        <div class="tg" id="pvTags"></div>
        <div class="pvline good"><u>Use for</u><div id="pvGood"></div></div>
        <div class="pvline weak"><u>Blind to</u><div id="pvWeak"></div></div>
        <div id="pvHint"></div>
      </div>

      <!-- A placed defence: live stats, upgrade and sell. -->
      <div id="inspect">
        <div class="r1"><div id="insDot"></div><div id="insName"></div><div id="insLvl"></div></div>
        <div id="insBlurb"></div>
        <div id="insNums"></div>
        <div class="btns">
          <button id="upBtn" type="button">Upgrade</button>
          <button id="sellBtn" type="button">Sell</button>
          <button id="closeBtn" type="button" aria-label="Close">✕</button>
        </div>
      </div>
    </div>

    <!-- Menu, briefing, pause, defeat and victory all render in here. -->
    <div id="ov"><div id="ovScroll"><div id="ovBox"></div></div></div>
  </div>

  <div id="shop"></div>

  <!-- Start-up problems, shown here rather than as a black screen. -->
  <div id="oops" hidden></div>
</div>

<script>
/*
 * Start-up problems have to be visible. A module graph that fails to link
 * never runs a line of main.js, so nothing inside the game can report it and
 * the page would otherwise sit there black with no clue why. This is
 * deliberately plain, dependency-free script: it has to work on the days the
 * rest of the site does not.
 */
(function () {
  var told = false;

  /** Called by main.js for a start-up step that threw, and from here below. */
  window.gameProblem = function (label, detail) {
    if (told) return;
    told = true;
    var box = document.getElementById('oops');
    if (!box) return;
    box.innerHTML = '<b></b><span></span><button type="button">Reload</button>';
    box.firstChild.textContent = label;
    box.firstChild.nextSibling.textContent = String(detail || '');
    box.lastChild.onclick = function () { location.reload(); };
    box.hidden = false;
  };

  // Whatever failed first is the interesting one, including a link error in a
  // module, which reports here and nowhere else.
  var first = null;
  window.addEventListener('error', function (e) {
    if (first) return;
    if (e.message) {
      first = e.message + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
    } else if (e.target && e.target.src) {
      first = 'could not load ' + String(e.target.src).split('/').pop();
    }
  }, true);

  /*
   * Module scripts are deferred, so by DOMContentLoaded main.js has either
   * booted or failed, and a missing flag means failed. One reload first: it
   * revalidates every module, which fixes the half-updated cache a deploy can
   * leave behind. A second failure is a real fault, so say what it was.
   */
  window.addEventListener('DOMContentLoaded', function () {
    if (document.documentElement.hasAttribute('data-booted')) return;
    var key = 'head-of-ai-defence:reboot';
    var tried;
    try {
      tried = sessionStorage.getItem(key);
      sessionStorage.setItem(key, '1');
    } catch (e) {
      tried = '1';
    }
    if (!tried) {
      location.reload();
      return;
    }
    window.gameProblem('The game could not start', first || 'the code did not load');
  });
})();
</script>
<script type="module" src="src/main.js"></script>
